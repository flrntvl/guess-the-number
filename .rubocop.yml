# frozen_string_literal: true

plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false

# Test suites legitimately group many examples in a single block.
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

# Specs commonly assert an output and a mock interaction in the same example.
RSpec/MultipleExpectations:
  Max: 2

RSpec/ExampleLength:
  Max: 12

Metrics/ParameterLists:
  Exclude:
    - 'spec/**/*'
